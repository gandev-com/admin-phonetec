# /var/www/phonetec/docker-compose.yml
# Este archivo vive en el servidor, NO en los repositorios.
#
# Uso:
#   docker compose pull && docker compose up -d

services:

  # ── API NestJS ──────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/TU_USUARIO/phonetec-api:latest
    restart: unless-stopped
    env_file: ./api.env
    volumes:
      - uploads:/app/uploads
    networks:
      - phonetec

  # ── Frontend Next.js ────────────────────────────────────────────────────────
  admin:
    image: ghcr.io/TU_USUARIO/phonetec-admin:latest
    restart: unless-stopped
    env_file: ./admin.env
    depends_on:
      - api
    networks:
      - phonetec

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/phonetec.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api
      - admin
    networks:
      - phonetec

  # ── Certbot (renovación automática de TLS) ──────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Se ejecuta manualmente la primera vez; luego cron lo renueva
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  uploads:
  certbot-certs:
  certbot-www:

networks:
  phonetec:
    driver: bridge
